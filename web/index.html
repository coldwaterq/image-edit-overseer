<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image-edit-overseer</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #1a1a18;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #6b4ea8;
    --accent-soft: #ede8f7;
    --good: #2f7d4f;
    --warn: #a8752f;
    --bad: #a83f3f;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --panel: #1f1f23; --ink: #ececea; --muted: #9a9a95;
      --line: #2e2e34; --accent: #a68ce0; --accent-soft: #2a2438;
      --good: #6cc08b; --warn: #d6a460; --bad: #e08080;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --panel: #1f1f23; --ink: #ececea; --muted: #9a9a95;
    --line: #2e2e34; --accent: #a68ce0; --accent-soft: #2a2438;
    --good: #6cc08b; --warn: #d6a460; --bad: #e08080;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 22px 28px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; font-weight: 640; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; }

  .wrap {
    display: grid; grid-template-columns: 340px minmax(0,1fr);
    gap: 26px; padding: 26px 28px; align-items: start;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
  }
  .sticky { position: sticky; top: 22px; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }

  #drop {
    border: 1.5px dashed var(--line); border-radius: 11px; padding: 22px 14px;
    text-align: center; color: var(--muted); cursor: pointer; font-size: 13.5px;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop img { max-width: 100%; border-radius: 8px; display: block; margin: 0 auto; }

  textarea, select, input[type=number] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 84px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button {
    width: 100%; padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 620;
    cursor: pointer; font-size: 15px;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button.danger:hover { background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .slider { width: 100%; accent-color: var(--accent); padding: 0; }
  #itersOut { color: var(--accent); font-variant-numeric: tabular-nums; }
  .stopped { opacity: .75; }

  details.adv { margin-top: 4px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  #status {
    margin-top: 14px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; min-height: 20px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .empty { color: var(--muted); text-align: center; padding: 70px 20px; font-size: 14px; }

  .card { margin-bottom: 20px; overflow: hidden; padding: 0; }
  .card-head {
    display: flex; align-items: center; gap: 12px; padding: 13px 17px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .n { font-weight: 660; font-size: 14px; }
  .badge {
    margin-left: auto; font-weight: 660; font-size: 13px; padding: 3px 11px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    white-space: nowrap;
  }
  .badge.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .badge.bad  { background: color-mix(in srgb, var(--bad) 16%, transparent);  color: var(--bad); }
  .secs { font-size: 12.5px; color: var(--muted); }

  .card-body { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 0; }
  @media (max-width: 760px) { .card-body { grid-template-columns: 1fr; } }
  .shot { background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .shot img { max-width: 100%; border-radius: 9px; display: block; }
  .side { padding: 15px 17px; border-left: 1px solid var(--line); min-width: 0; }
  @media (max-width: 760px) { .side { border-left: 0; border-top: 1px solid var(--line); } }

  .side h4 {
    margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); font-weight: 640;
  }
  .prompt {
    font-size: 13px; line-height: 1.5; background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; margin: 0 0 14px; white-space: pre-wrap;
    word-break: break-word;
  }
  ul.issues { margin: 0; padding-left: 17px; font-size: 13.5px; }
  ul.issues li { margin-bottom: 6px; }
  .none { color: var(--good); font-size: 13.5px; font-weight: 560; }

  .final { border-color: var(--accent); }
  .final .card-head { background: var(--accent-soft); }
  .working { display: flex; align-items: center; gap: 9px; padding: 15px 17px; color: var(--muted); font-size: 13.5px; }
  .err { color: var(--bad); padding: 15px 17px; font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <h1>image-edit-overseer</h1>
  <p>Describe the edit. A local model writes the prompt, grades the result, and tries again until it&rsquo;s right.</p>
</header>

<div class="wrap">
  <form class="panel sticky" id="form">
    <div class="field">
      <label for="drop">Source image</label>
      <div id="drop" tabindex="0">
        <span id="dropText">Click or drop an image here</span>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </div>

    <div class="field">
      <label for="request">What should change?</label>
      <textarea id="request" placeholder="make the sky a stormy purple, leave the house and tree exactly as they are"></textarea>
    </div>

    <div class="field">
      <label for="max_iters">Max attempts &mdash; <span id="itersOut">5</span></label>
      <input type="range" id="max_iters" min="1" max="12" value="5" class="slider">
      <div class="hint">Each attempt is one render plus one critique.</div>
    </div>

    <details class="adv">
      <summary>More settings</summary>
      <div class="row field">
        <div>
          <label for="editor">Editor</label>
          <select id="editor">
            <option value="flux">FLUX.2 klein</option>
            <option value="qwen">Qwen-Image-Edit</option>
          </select>
        </div>
        <div>
          <label for="flux_size">Size</label>
          <select id="flux_size"><option>9B</option><option>4B</option></select>
        </div>
      </div>
      <div class="field">
        <label for="max_side">Max pixels (longest edge)</label>
        <input type="number" id="max_side" value="1024" min="256" max="2048" step="64">
      </div>
      <div class="field">
        <label for="judge_model">Judge (Ollama)</label>
        <input type="text" id="judge_model" value="qwen3.6:27b"
               style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px">
      </div>
    </details>

    <button type="submit" id="go" disabled>Start</button>
    <button type="button" id="stop" class="danger" hidden>Stop</button>
    <div id="status"></div>
  </form>

  <main id="feed"><div class="panel empty">Nothing yet &mdash; add an image and describe the edit.</div></main>
</div>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), file = $('file'), feed = $('feed'), go = $('go'),
      stop = $('stop'), status = $('status');
let picked = null, activeRun = null, stopping = false;

function refresh() { go.disabled = !(picked && $('request').value.trim()) || !stop.hidden; }
$('request').addEventListener('input', refresh);
$('max_iters').addEventListener('input', () => { $('itersOut').textContent = $('max_iters').value; });

drop.addEventListener('click', () => file.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});
file.addEventListener('change', () => { if (file.files[0]) setFile(file.files[0]); });

function setFile(f) {
  picked = f;
  const r = new FileReader();
  r.onload = e => { drop.innerHTML = `<img src="${e.target.result}" alt="source">`; };
  r.readAsDataURL(f);
  refresh();
}

function running(on) {
  go.hidden = on; stop.hidden = !on;
  if (!on) { stop.disabled = false; stop.textContent = 'Stop'; stopping = false; }
  refresh();
}

stop.addEventListener('click', async () => {
  if (!activeRun || stopping) return;
  stopping = true;
  stop.disabled = true;
  stop.textContent = 'Stopping…';
  setStatus('Stopping after this step finishes…', true);
  try { await fetch('/api/stop/' + activeRun, { method: 'POST' }); }
  catch { setStatus('Could not reach the server.', false); }
});

function setStatus(text, busy) {
  status.innerHTML = text
    ? `<span class="dot${busy ? ' pulse' : ''}"></span><span>${text}</span>` : '';
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cardFor(n) {
  let el = document.getElementById('iter' + n);
  if (el) return el;
  if (feed.querySelector('.empty')) feed.innerHTML = '';
  el = document.createElement('section');
  el.className = 'panel card';
  el.id = 'iter' + n;
  el.innerHTML = `
    <div class="card-head"><span class="n">Attempt ${n}</span><span class="secs"></span>
      <span class="badge">rendering&hellip;</span></div>
    <div class="working"><span class="dot pulse"></span><span>Generating image&hellip;</span></div>`;
  feed.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  return el;
}

function badgeClass(score) { return score >= 8 ? 'good' : score >= 5 ? 'warn' : 'bad'; }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  running(true);
  feed.innerHTML = '';
  setStatus('Starting&hellip;', true);

  const fd = new FormData();
  fd.append('image', picked);
  fd.append('request', $('request').value.trim());
  for (const k of ['max_iters', 'editor', 'flux_size', 'judge_model', 'max_side'])
    fd.append(k, $(k).value);

  let runId;
  try {
    const res = await fetch('/api/run', { method: 'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    runId = (await res.json()).run_id;
    activeRun = runId;
  } catch (err) {
    setStatus('Failed: ' + err.message, false); running(false); return;
  }

  const src = new EventSource('/api/stream/' + runId);
  src.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'start') {
      setStatus(`${d.editor} &middot; judged by ${d.judge}`, true);
    } else if (d.type === 'plan') {
      const el = cardFor(d.iteration);
      el.dataset.prompt = d.prompt;
      setStatus('Wrote a prompt, generating&hellip;', true);
    } else if (d.type === 'freed') {
      setStatus('Freed ' + d.models.join(', ') + ' from VRAM&hellip;', true);
    } else if (d.type === 'render') {
      const el = cardFor(d.iteration);
      el.querySelector('.secs').textContent = d.seconds + 's';
      el.querySelector('.badge').textContent = 'judging…';
      const prompt = el.dataset.prompt || d.prompt || '';
      el.querySelector('.working')?.remove();
      const body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML = `
        <div class="shot"><img src="${d.url}" alt="attempt ${d.iteration}"></div>
        <div class="side">
          <h4>Prompt used</h4>
          <p class="prompt">${esc(prompt)}</p>
          <h4>Critique</h4>
          <div class="crit"><span class="dot pulse"></span> looking&hellip;</div>
        </div>`;
      el.appendChild(body);
      setStatus('Judging the result&hellip;', true);
    } else if (d.type === 'critique') {
      const el = cardFor(d.iteration);
      const b = el.querySelector('.badge');
      b.textContent = d.score + '/10' + (d.satisfied ? ' &middot; accepted' : '');
      b.innerHTML = d.score + '/10' + (d.satisfied ? ' &middot; accepted' : '');
      b.className = 'badge ' + badgeClass(d.score);
      const crit = el.querySelector('.crit');
      crit.innerHTML = d.issues && d.issues.length
        ? '<ul class="issues">' + d.issues.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>'
        : '<span class="none">No issues found.</span>';
      if (d.satisfied) el.classList.add('final');
    } else if (d.type === 'revised') {
      const el = cardFor(d.iteration + 1);
      el.dataset.prompt = d.prompt;
      setStatus('Rewriting the prompt&hellip;', true);
    } else if (d.type === 'done') {
      setStatus(d.satisfied
        ? `Accepted after ${d.iterations} attempt${d.iterations > 1 ? 's' : ''}.`
        : `Stopped after ${d.iterations} without a pass — best ${d.best_score}/10.`, false);
      running(false);
    } else if (d.type === 'stopped') {
      setStatus('Stopped. Attempts so far are kept below.', false);
      document.querySelectorAll('.card .working').forEach(w => {
        w.innerHTML = '<span>Cancelled before this attempt finished.</span>';
        w.closest('.card').classList.add('stopped');
      });
      running(false);
    } else if (d.type === 'error') {
      setStatus('Error: ' + d.message, false);
      running(false);
    } else if (d.type === 'close') {
      src.close();
      activeRun = null;
      running(false);
    }
  };
  src.onerror = () => { setStatus('Connection lost.', false); src.close(); running(false); };
});
</script>
</body>
</html>
